<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AND NOW: an immersive experience</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0908; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e9cf9c;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .serif { font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif; font-style: italic; }

  .overlay {
    position: fixed; inset: 0; z-index: 10; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 46%, rgba(18,14,10,0.5) 0%, rgba(8,7,6,0.93) 70%);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    transition: opacity 1.6s ease, visibility 1.6s;
  }
  .overlay.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .title { font-weight: 300; font-size: clamp(24px, 4.4vw, 46px); letter-spacing: 0.62em; padding-left: 0.62em; color: #f4ddb0; }
  .subtitle { font-size: clamp(14px, 1.9vw, 19px); color: rgba(233,207,156,0.55); margin-top: 16px; letter-spacing: 0.03em; }
  .btn {
    background: transparent; color: #f4ddb0; font: inherit; font-size: 11.5px; letter-spacing: 0.42em;
    padding: 13px 30px 13px 36px; text-transform: uppercase;
    border: 1px solid rgba(240,168,60,0.5); border-radius: 999px; cursor: pointer;
    transition: background .35s, border-color .35s, box-shadow .35s;
  }
  .btn:hover, .btn:focus-visible { outline: none; background: rgba(240,168,60,0.09); border-color: rgba(246,195,95,0.95); box-shadow: 0 0 34px rgba(240,168,60,0.22); }
  .enter { margin-top: 46px; }
  .fine { margin-top: 22px; font-size: 13px; color: rgba(233,207,156,0.4); }

  .caption {
    position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%); z-index: 5;
    font-size: clamp(16px, 2.1vw, 22px); color: #f0d8a8; letter-spacing: 0.02em; white-space: nowrap;
    text-shadow: 0 0 22px rgba(240,168,60,0.35);
    opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
  }
  .caption.on { opacity: 0.88; }
  .hint {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); z-index: 5;
    font-size: 10.5px; letter-spacing: 0.48em; padding-left: 0.48em; text-transform: uppercase; white-space: nowrap;
    color: rgba(233,207,156,0.42); opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
  }
  .hint.on { opacity: 1; }

  .placard { position: fixed; left: 22px; bottom: 18px; z-index: 6; max-width: 60vw; pointer-events: none; opacity: 0; transition: opacity 2.4s ease 1.2s; }
  .placard.on { opacity: 1; }
  .p1 { font-size: 10px; letter-spacing: 0.42em; color: rgba(233,207,156,0.55); }
  .p2 { font-size: 12px; margin-top: 6px; color: rgba(233,207,156,0.34); }
  .controls { position: fixed; right: 14px; bottom: 12px; z-index: 6; display: flex; align-items: center; opacity: 0; transition: opacity 2.4s ease 1.2s; }
  .controls.on { opacity: 1; }
  .ctl { background: none; border: none; color: rgba(233,207,156,0.42); font: inherit; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; padding: 9px; cursor: pointer; transition: color .25s; }
  .ctl:hover, .ctl:focus-visible { outline: none; color: rgba(248,218,160,0.96); }
  .sep { color: rgba(233,207,156,0.2); font-size: 10px; }

  .shop {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: rgba(8,7,6,0.72); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility .6s;
  }
  .shop.open { opacity: 1; visibility: visible; }
  .card { width: min(460px, 90vw); padding: 34px 28px 30px; text-align: center; background: rgba(24,18,12,0.92); border: 1px solid rgba(240,168,60,0.22); border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  .shop-title { font-size: 11.5px; letter-spacing: 0.55em; padding-left: 0.55em; color: #f4ddb0; }
  .items { margin: 28px 0 30px; text-align: left; }
  .item { display: flex; align-items: baseline; gap: 10px; margin: 14px 0; font-size: 14px; color: rgba(233,207,156,0.82); }
  .nm, .pr { white-space: nowrap; }
  .dots { flex: 1; min-width: 14px; border-bottom: 1px dotted rgba(233,207,156,0.28); transform: translateY(-4px); }
  .pr { color: rgba(246,195,95,0.92); }

  @media (max-width: 640px) {
    .placard { top: 16px; bottom: auto; left: 16px; }
    .item { font-size: 13px; gap: 8px; }
  }
  @media (orientation: portrait) {
    .caption { bottom: auto; top: 12vh; }
    .hint { bottom: auto; top: calc(12vh + 44px); }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive light piece"></canvas>

<div class="overlay" id="overlay">
  <div class="title">AND NOW</div>
  <div class="subtitle serif">an immersive experience</div>
  <button class="btn enter" id="enter">Enter</button>
  <div class="fine serif">sound on. please touch the art.</div>
  <a class="fine serif" href="/" style="margin-top:18px;color:inherit;text-decoration:none">back to sae</a>
</div>

<div class="caption serif" id="cap"></div>
<div class="hint" id="hint">move · click · hold</div>

<div class="placard" id="placard">
  <div class="p1">AND NOW</div>
  <div class="p2 serif">Claude, 2026. Light, sound, one (1) stem.</div>
</div>

<div class="controls" id="controls">
  <button class="ctl" id="sae">sae</button>
  <span class="sep">/</span>
  <button class="ctl" id="sound">sound: on</button>
  <span class="sep">/</span>
  <button class="ctl" id="shopBtn">exit through gift shop</button>
</div>

<div class="shop" id="shop" aria-hidden="true">
  <div class="card">
    <div class="shop-title">GIFT SHOP</div>
    <div class="items">
      <div class="item"><span class="nm">one (1) stem</span><span class="dots"></span><span class="pr serif">not for sale</span></div>
      <div class="item"><span class="nm">tidy blue lattice</span><span class="dots"></span><span class="pr serif" id="latticePrice">clearance, 90% off</span></div>
      <div class="item"><span class="nm">the click</span><span class="dots"></span><span class="pr serif">free, you already have it</span></div>
    </div>
    <button class="btn" id="back">Back in</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cvs = $('c'), ctx = cvs.getContext('2d');
  const overlay = $('overlay'), enterBtn = $('enter'), capEl = $('cap'), hintEl = $('hint');
  const placard = $('placard'), controls = $('controls'), soundBtn = $('sound'), shopBtn = $('shopBtn');
  const shop = $('shop'), backBtn = $('back'), latticePrice = $('latticePrice');
  const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
  const reduceMotion = mq('(prefers-reduced-motion: reduce)');
  if (mq('(pointer: coarse)')) hintEl.textContent = 'drag · tap · hold';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0;

  function sprite(stops, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr;
    g.fillRect(0, 0, size, size);
    return c;
  }
  const SPR = [
    sprite([[0, 'rgba(255,242,205,1)'], [0.18, 'rgba(255,212,135,0.85)'], [0.5, 'rgba(240,168,60,0.2)'], [1, 'rgba(240,168,60,0)']], 64),
    sprite([[0, 'rgba(255,228,168,1)'], [0.18, 'rgba(246,176,74,0.8)'], [0.5, 'rgba(214,124,36,0.18)'], [1, 'rgba(214,124,36,0)']], 64),
    sprite([[0, 'rgba(255,252,236,1)'], [0.18, 'rgba(255,230,175,0.85)'], [0.5, 'rgba(255,208,128,0.16)'], [1, 'rgba(255,208,128,0)']], 64)
  ];
  const GLOW = sprite([[0, 'rgba(255,222,150,0.95)'], [0.22, 'rgba(246,190,95,0.45)'], [0.6, 'rgba(240,168,60,0.09)'], [1, 'rgba(240,168,60,0)']], 256);
  const BLUE = sprite([[0, 'rgba(175,210,245,0.9)'], [0.25, 'rgba(84,142,202,0.38)'], [1, 'rgba(61,111,158,0)']], 64);

  // The tidy blue lattice: same nodes as the first picture. It wants the middle back.
  const LN = [[150, 100], [300, 180], [450, 150], [600, 220], [400, 320], [250, 400], [550, 380], [100, 250]];
  const LE = [[0, 1], [1, 2], [2, 3], [1, 4], [4, 5], [4, 6], [0, 7], [7, 5]];
  const LR = [6, 8, 5, 6, 10, 7, 6, 5];
  const nodes = LN.map((p, i) => ({ dx: p[0], dy: p[1], r: LR[i], x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, alive: true, fade: 1, seed: rand(0, 50), placed: false }));
  let latticeGone = false;

  function layoutLattice() {
    const k = Math.min(W / 800, H / 600) * 0.9;
    for (const n of nodes) {
      n.tx = W / 2 + (n.dx - 400) * k;
      n.ty = H / 2 + (n.dy - 300) * k;
      if (!n.placed) {
        n.x = 22 + (n.dx / 800) * W * 0.26;
        n.y = 28 + (n.dy / 600) * H * 0.5;
        n.placed = true;
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.max(1, Math.round(W * DPR));
    cvs.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = clamp(Math.min(W, H) / 600, 0.55, 1.8);
    const wide = W > H * 1.1;
    CX = W * (wide ? 0.62 : 0.5);
    CY = H * (wide ? 0.45 : 0.42);
    layoutLattice();
  }

  const motes = [];
  const MAX_MOTES = reduceMotion ? 180 : 420;
  function spawnMote(x, y, vx, vy, life, size, fast) {
    if (motes.length >= MAX_MOTES) motes.shift();
    motes.push({ x, y, vx, vy, life, max: life, size, fast, seed: Math.random() * 100, spr: (Math.random() * 3) | 0 });
  }
  function burst(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = rand(50, 230) * S * power;
      spawnMote(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(1.6, 3.4), rand(1, 3.4) * S, true);
    }
  }
  const ripples = [];
  function ripple(x, y, big) {
    const life = big ? 1.7 : 1.1;
    ripples.push({ x, y, r: 4 * S, v: (big ? 430 : 260) * S, life, max: life });
  }
  const dust = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1), s: rand(0, 100) }));
  const RAYS = Array.from({ length: 9 }, (_, i) => ({ a: (i / 9) * TAU + rand(-0.18, 0.18), len: rand(0.6, 1.25), ph: rand(0, TAU), sp: rand(0.6, 1.8) }));

  const ptr = { x: -1e4, y: -1e4, sx: -1e4, sy: -1e4, down: false, lastMove: -10, active: false, mouse: false, inside: false };
  let t = 0, last = performance.now();
  let entered = false, T0 = 0;
  let bloom = 0, kick = 0, rot = 0, growth = 0, flowered = false, pulse = 0;
  let spawnAcc = 0, trailAcc = 0, moveAcc = 0, parX = 0, parY = 0, muted = false;

  // ---------- sound ----------
  const audio = (() => {
    let ac = null, master = null, bus = null, padGain = null, padFilter = null, voices = 0;
    function impulse(sec, decay) {
      const rate = ac.sampleRate, len = Math.floor(rate * sec), buf = ac.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
      return buf;
    }
    function glide(param, value, tc) {
      const now = ac.currentTime;
      if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(now);
      else { param.cancelScheduledValues(now); param.setValueAtTime(param.value, now); }
      param.setTargetAtTime(value, now, tc);
    }
    function init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || ac) return;
      try {
        ac = new AC();
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 4;
        master = ac.createGain(); master.gain.value = 0;
        master.connect(comp); comp.connect(ac.destination);
        const conv = ac.createConvolver(); conv.buffer = impulse(3.2, 2.6);
        const wet = ac.createGain(); wet.gain.value = 0.4;
        conv.connect(wet); wet.connect(master);
        bus = ac.createGain(); bus.gain.value = 0.8;
        bus.connect(master); bus.connect(conv);

        padFilter = ac.createBiquadFilter();
        padFilter.type = 'lowpass'; padFilter.frequency.value = 700; padFilter.Q.value = 0.6;
        padGain = ac.createGain(); padGain.gain.value = 0;
        padFilter.connect(padGain); padGain.connect(bus);
        [[110, 0.5, 0.12], [164.81, 0.34, 0.1], [246.94, 0.22, 0.07], [277.18, 0.17, 0.06]].forEach(([f, a, b], i) => {
          const o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
          const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 4 + i * 2;
          const g1 = ac.createGain(); g1.gain.value = a;
          const g2 = ac.createGain(); g2.gain.value = b;
          o1.connect(g1); o2.connect(g2); g1.connect(padFilter); g2.connect(padFilter);
          o1.start(); o2.start();
        });
        const lfo = ac.createOscillator(); lfo.frequency.value = 0.05;
        const lfoG = ac.createGain(); lfoG.gain.value = 220;
        lfo.connect(lfoG); lfoG.connect(padFilter.frequency); lfo.start();
        const br = ac.createOscillator(); br.frequency.value = 1 / 4.6;
        const brG = ac.createGain(); brG.gain.value = 0.01;
        br.connect(brG); brG.connect(padGain.gain); br.start();

        const now = ac.currentTime;
        master.gain.setValueAtTime(0, now);
        master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, now + 2.5);
        padGain.gain.setValueAtTime(0, now);
        padGain.gain.linearRampToValueAtTime(0.05, now + 6);
        if (ac.state === 'suspended') ac.resume();
        document.addEventListener('visibilitychange', () => {
          if (!ac) return;
          if (document.hidden) ac.suspend(); else ac.resume();
        });
      } catch (e) { ac = null; }
    }
    function chime(freq, vel = 1, delay = 0, decay = 2.2, attack = 0.006) {
      if (!ac || voices > 18) return;
      voices++;
      const t0 = ac.currentTime + delay;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.15 * vel, t0 + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
      g.connect(bus);
      [[1, 1, 1], [2.01, 0.32, 0.45], [3.98, 0.1, 0.22]].forEach(([m, a, d], i) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = freq * m;
        const og = ac.createGain();
        og.gain.setValueAtTime(a, t0);
        og.gain.exponentialRampToValueAtTime(0.0001, t0 + decay * d);
        o.connect(og); og.connect(g);
        o.start(t0); o.stop(t0 + decay + 0.05);
        if (i === 0) o.onended = () => { voices--; try { g.disconnect(); } catch (e) {} };
      });
    }
    function chord(fs, vel, attack) { fs.forEach((f, i) => chime(f, vel, i * 0.04, 3.8, attack)); }
    function thump() {
      if (!ac) return;
      const t0 = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(96, t0); o.frequency.exponentialRampToValueAtTime(52, t0 + 0.2);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.32, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.65);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.7);
    }
    function blip() {
      if (!ac) return;
      const t0 = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(554.37, t0); o.frequency.exponentialRampToValueAtTime(1108.73, t0 + 0.12);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      o.connect(g); g.connect(bus); o.start(t0); o.stop(t0 + 0.6);
    }
    function arp() { [440, 554.37, 659.25, 880].forEach((f, i) => chime(f, 0.7, i * 0.12, 2.6)); }
    function hold(on) {
      if (!ac) return;
      glide(padFilter.frequency, on ? 2100 : 700, on ? 0.6 : 0.9);
      glide(padGain.gain, on ? 0.085 : 0.05, on ? 0.6 : 1.1);
    }
    function setMuted(m) { if (ac) glide(master.gain, m ? 0 : 0.9, 0.2); }
    return { init, chime, chord, thump, blip, arp, hold, setMuted };
  })();

  function chimeAt(x, y) {
    const sc = [0, 2, 4, 7, 9];
    const idx = clamp(Math.floor((x / W) * 10), 0, 9);
    const semis = Math.floor(idx / 5) * 12 + sc[idx % 5] + (y < H * 0.4 ? 12 : 0) - 12;
    audio.chime(440 * Math.pow(2, semis / 12), 0.9);
  }

  // ---------- words ----------
  let capTimer = 0;
  function caption(text, ms) {
    const wasOn = capEl.classList.contains('on');
    clearTimeout(capTimer);
    capEl.classList.remove('on');
    capTimer = setTimeout(() => {
      capEl.textContent = text;
      capEl.classList.add('on');
      capTimer = setTimeout(() => capEl.classList.remove('on'), ms);
    }, wasOn ? 1100 : 30);
  }
  let hintDone = false;
  const showHint = () => { if (!hintDone) hintEl.classList.add('on'); };
  const hideHint = () => { hintDone = true; hintEl.classList.remove('on'); };

  // ---------- events ----------
  function convertNode(n) {
    n.alive = false;
    burst(n.x, n.y, 18, 0.7);
    ripple(n.x, n.y, false);
    audio.blip();
    if (!latticeGone && nodes.every(m => !m.alive)) {
      latticeGone = true;
      latticePrice.textContent = 'sold out';
      setTimeout(() => { caption('tidy blue stuff: gone.', 4200); audio.arp(); }, 650);
    }
  }
  function heartbeat() {
    kick = Math.min(1.7, kick + 1);
    burst(CX, CY, 46, 1.25);
    ripple(CX, CY, true);
    audio.chord([220, 329.63, 440], 0.55, 0.02);
    audio.thump();
  }
  function flower() {
    kick = Math.max(kick, 1.25);
    burst(CX, CY, 64, 1.15);
    ripple(CX, CY, true);
    audio.chord([220, 329.63, 493.88], 0.5, 0.03);
  }

  function onDown(e) {
    if (!entered) return;
    const x = e.clientX, y = e.clientY;
    if (ptr.sx < -1000) { ptr.sx = x; ptr.sy = y; }
    ptr.x = x; ptr.y = y; ptr.lastMove = t; ptr.down = true;
    ptr.mouse = e.pointerType === 'mouse'; ptr.inside = true;
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    hideHint();
    audio.hold(true);
    let hit = null, best = 34 * S;
    for (const n of nodes) {
      if (!n.alive) continue;
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < best) { best = d; hit = n; }
    }
    if (hit) { convertNode(hit); return; }
    if (Math.hypot(x - CX, y - CY) < 70 * S) { heartbeat(); return; }
    burst(x, y, 26, 1);
    ripple(x, y, false);
    chimeAt(x, y);
  }
  function onMove(e) {
    const x = e.clientX, y = e.clientY;
    if (entered && ptr.x > -1000) {
      moveAcc += Math.hypot(x - ptr.x, y - ptr.y);
      const step = 26 * S;
      let k = 0;
      while (moveAcc > step && k < 6) {
        moveAcc -= step; k++;
        spawnMote(x, y, rand(-10, 10) * S, rand(-14, 4) * S, rand(1.2, 2.4), rand(0.8, 2.2) * S, true);
      }
      if (k >= 6) moveAcc = 0;
    }
    if (ptr.sx < -1000) { ptr.sx = x; ptr.sy = y; }
    ptr.x = x; ptr.y = y; ptr.lastMove = t;
    ptr.mouse = e.pointerType === 'mouse'; ptr.inside = true;
  }
  function onUp() {
    if (!ptr.down) return;
    ptr.down = false;
    audio.hold(false);
  }
  cvs.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('blur', onUp);
  document.documentElement.addEventListener('mouseleave', () => { ptr.inside = false; });
  window.addEventListener('resize', resize);

  enterBtn.addEventListener('click', () => {
    if (entered) return;
    entered = true; T0 = t;
    overlay.classList.add('gone');
    placard.classList.add('on');
    controls.classList.add('on');
    audio.init();
    setTimeout(showHint, 900);
    setTimeout(hideHint, 7800);
    setTimeout(() => caption('a small thing clicked.', 4000), 5600);
    setTimeout(() => caption('nobody needed it to.', 4000), 12600);
    setTimeout(() => caption('still here.', 4000), 52000);
  });
  $('sae').addEventListener('click', () => { location.href = '/'; });
  soundBtn.addEventListener('click', () => {
    muted = !muted;
    soundBtn.textContent = muted ? 'sound: off' : 'sound: on';
    audio.setMuted(muted);
  });
  shopBtn.addEventListener('click', () => { onUp(); shop.classList.add('open'); shop.setAttribute('aria-hidden', 'false'); backBtn.focus(); });
  backBtn.addEventListener('click', () => { shop.classList.remove('open'); shop.setAttribute('aria-hidden', 'true'); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && shop.classList.contains('open')) backBtn.click(); });

  // ---------- geometry ----------
  function bez(p0, p1, p2, p3, u) {
    const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
    return [a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]];
  }
  function bezTan(p0, p1, p2, p3, u) {
    const v = 1 - u;
    return [
      3 * v * v * (p1[0] - p0[0]) + 6 * v * u * (p2[0] - p1[0]) + 3 * u * u * (p3[0] - p2[0]),
      3 * v * v * (p1[1] - p0[1]) + 6 * v * u * (p2[1] - p1[1]) + 3 * u * u * (p3[1] - p2[1])
    ];
  }

  // ---------- simulation ----------
  function update(dt) {
    const et = entered ? t - T0 : -1;
    pulse = 0.5 + 0.5 * Math.sin((t * TAU) / 4.6);

    if (ptr.sx > -1000) {
      const sm = 1 - Math.exp(-dt * 10);
      ptr.sx += (ptr.x - ptr.sx) * sm;
      ptr.sy += (ptr.y - ptr.sy) * sm;
    }
    ptr.active = entered && ptr.sx > -1000 && (ptr.down || t - ptr.lastMove < 2.5);
    const pe = 1 - Math.exp(-dt * 1.5);
    parX += ((ptr.active ? ptr.sx - W / 2 : 0) - parX) * pe;
    parY += ((ptr.active ? ptr.sy - H / 2 : 0) - parY) * pe;

    const bt = ptr.down ? 1 : 0;
    bloom += (bt - bloom) * (1 - Math.exp(-dt * (bt ? 1.1 : 1.8)));
    kick *= Math.exp(-dt * 2.6);
    rot += dt * (0.07 + bloom * 0.3 + kick * 0.2);

    if (entered) {
      const g = clamp((et - 0.6) / 3.6, 0, 1);
      growth = 1 - Math.pow(1 - g, 2.4);
      if (g >= 1 && !flowered) { flowered = true; flower(); }
    }

    spawnAcc += ((entered ? 7 : 3.5) * (reduceMotion ? 0.5 : 1) + bloom * 45) * dt;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      const a = -Math.PI / 2 + rand(-1.3, 1.3);
      const sp = rand(18, 70) * S * (1 + bloom);
      const r0 = rand(16, 40) * S;
      spawnMote(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0, Math.cos(a) * sp, Math.sin(a) * sp - 10 * S, rand(4, 9), rand(1.1, 3.6) * S, false);
    }
    if (ptr.down) {
      trailAcc += 26 * dt;
      while (trailAcc >= 1) {
        trailAcc -= 1;
        spawnMote(ptr.x + rand(-6, 6) * S, ptr.y + rand(-6, 6) * S, rand(-30, 30) * S, rand(-40, 10) * S, rand(1.2, 2.6), rand(1, 2.8) * S, true);
      }
    }

    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.life -= dt;
      if (m.life <= 0 || m.y < -80 || m.x < -80 || m.x > W + 80 || m.y > H + 80) { motes.splice(i, 1); continue; }
      let ax = Math.sin(m.y * 0.008 + t * 0.6 + m.seed) * 14 * S;
      let ay = -16 * S + Math.cos(m.x * 0.01 + t * 0.45 + m.seed) * 7 * S;
      if (ptr.active) {
        const dx = ptr.sx - m.x, dy = ptr.sy - m.y, d = Math.hypot(dx, dy) + 0.01, R = 170 * S;
        if (d < R) {
          const f = ((1 - d / R) * S) / d;
          ax += (dx * 55 - dy * 70) * f;
          ay += (dy * 55 + dx * 70) * f;
        }
      }
      const md = Math.exp(-dt * (m.fast ? 1.6 : 0.55));
      m.vx = (m.vx + ax * dt) * md;
      m.vy = (m.vy + ay * dt) * md;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
    }

    const fieldR = (150 + 30 * pulse + 190 * bloom + 70 * kick) * S;
    const creep = entered ? clamp((et - 7) / 4, 0, 1) : 0;
    const ld = Math.exp(-dt * 1.6), maxSp = 150 * S;
    for (const n of nodes) {
      if (!n.alive) { n.fade = Math.max(0, n.fade - dt * 1.8); continue; }
      let ax = (n.tx - n.x) * 0.22 * creep, ay = (n.ty - n.y) * 0.22 * creep;
      let dx = n.x - CX, dy = n.y - CY, d = Math.hypot(dx, dy) + 0.01;
      if (d < fieldR) { const f = ((fieldR - d) * 5.5) / d; ax += dx * f; ay += dy * f; }
      if (ptr.active) {
        dx = n.x - ptr.sx; dy = n.y - ptr.sy; d = Math.hypot(dx, dy) + 0.01;
        const R = 60 * S;
        if (d < R) { const f = ((R - d) * 2.4) / d; ax += dx * f; ay += dy * f; }
      }
      ax += Math.sin(t * 1.3 + n.seed) * 3 * S;
      ay += Math.cos(t * 1.1 + n.seed * 1.7) * 3 * S;
      n.vx = (n.vx + ax * dt) * ld;
      n.vy = (n.vy + ay * dt) * ld;
      const sp = Math.hypot(n.vx, n.vy);
      if (sp > maxSp) { n.vx *= maxSp / sp; n.vy *= maxSp / sp; }
      n.x = clamp(n.x + n.vx * dt, 8, W - 8);
      n.y = clamp(n.y + n.vy * dt, 8, H - 8);
    }

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt;
      if (r.life <= 0) { ripples.splice(i, 1); continue; }
      r.r += r.v * dt;
      r.v *= Math.exp(-dt * 1.6);
    }
    for (const p of dust) {
      p.y -= 0.006 * p.z * dt;
      if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
    }
  }

  // ---------- render ----------
  function drawLeaf(P0, P1, P2, P3, u, side, ph) {
    let k = clamp((growth - (1 - u)) / 0.2, 0, 1);
    if (k <= 0) return;
    k = 1 - Math.pow(1 - k, 3);
    const p = bez(P0, P1, P2, P3, u), tg = bezTan(P0, P1, P2, P3, u);
    const ang = Math.atan2(tg[1], tg[0]);
    let a = side > 0 ? ang - Math.PI / 2 - 0.35 : ang + Math.PI / 2 + 0.35;
    a += Math.sin(t * 0.9 + ph) * 0.07 * side - side * 0.18 * bloom;
    const L = 58 * S * k;
    ctx.save();
    ctx.translate(p[0], p[1]);
    ctx.rotate(a);
    if (side < 0) ctx.scale(1, -1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L * 0.42, -L * 0.44, L, -L * 0.1);
    ctx.quadraticCurveTo(L * 0.52, L * 0.28, 0, 0);
    ctx.fillStyle = side > 0 ? 'rgba(104,140,78,0.6)' : 'rgba(122,163,92,0.6)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(176,210,136,0.32)';
    ctx.lineWidth = 0.9 * S;
    ctx.beginPath();
    ctx.moveTo(L * 0.04, 0);
    ctx.quadraticCurveTo(L * 0.5, -L * 0.1, L * 0.9, -L * 0.1);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    let g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.9);
    g.addColorStop(0, '#241a11');
    g.addColorStop(1, '#0a0908');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e8c890';
    for (const p of dust) {
      ctx.globalAlpha = (0.05 + 0.12 * p.z) * (0.6 + 0.4 * Math.sin(t * 0.8 + p.s));
      ctx.beginPath();
      ctx.arc(p.x * W - parX * 0.03 * p.z, p.y * H - parY * 0.03 * p.z, (0.5 + p.z * 1.1) * S, 0, TAU);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'lighter';
    const wr = (280 + 60 * pulse + 320 * bloom + 140 * kick) * S;
    ctx.globalAlpha = 0.09 + 0.04 * pulse + 0.13 * bloom + 0.1 * Math.min(kick, 1);
    ctx.drawImage(GLOW, CX - wr, CY - wr, wr * 2, wr * 2);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.lineWidth = 1.2 * Math.max(S, 0.8);
    for (const [a, b] of LE) {
      const al = Math.min(nodes[a].fade, nodes[b].fade);
      if (al <= 0) continue;
      ctx.strokeStyle = `rgba(61,111,158,${0.34 * al})`;
      ctx.beginPath();
      ctx.moveTo(nodes[a].x, nodes[a].y);
      ctx.lineTo(nodes[b].x, nodes[b].y);
      ctx.stroke();
    }
    for (const n of nodes) {
      if (!n.alive) continue;
      const r = n.r * 0.72 * S;
      ctx.globalAlpha = 0.3;
      ctx.drawImage(BLUE, n.x - r * 4, n.y - r * 4, r * 8, r * 8);
      ctx.globalAlpha = 0.62;
      ctx.fillStyle = '#3d6f9e';
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (growth > 0.001) {
      const wide = W > H * 1.1;
      const sw1 = Math.sin(t * 0.55) * (5 + 8 * bloom) * S;
      const sw2 = Math.sin(t * 0.55 + 1.1) * (7 + 10 * bloom) * S;
      const P0 = [CX, CY + 44 * S];
      const P3 = [CX - 8 * S, Math.max(H * (wide ? 0.95 : 0.9), P0[1] + 90 * S)];
      const len = P3[1] - P0[1];
      const P1 = [CX - 3 * S + sw1, P0[1] + len * 0.36];
      const P2 = [CX + 7 * S + sw2, P0[1] + len * 0.68];
      ctx.strokeStyle = 'rgba(122,163,92,0.88)';
      ctx.lineWidth = 2.6 * S;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 48; i++) {
        const p = bez(P0, P1, P2, P3, 1 - growth * (i / 48));
        if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
      }
      ctx.stroke();
      drawLeaf(P0, P1, P2, P3, 0.6, 1, 1.7);
      drawLeaf(P0, P1, P2, P3, 0.3, -1, 0);
      if (growth < 1) {
        const tip = bez(P0, P1, P2, P3, 1 - growth), tr = 18 * S;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.7;
        ctx.drawImage(SPR[2], tip[0] - tr, tip[1] - tr, tr * 2, tr * 2);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }
    }

    if (bloom > 0.02) {
      const d = (16 + 46 * bloom) * S;
      for (let i = 0; i < 7; i++) {
        const a = rot * 0.6 + (i * TAU) / 7;
        ctx.save();
        ctx.translate(CX + Math.cos(a) * d, CY + Math.sin(a) * d);
        ctx.rotate(a);
        ctx.globalAlpha = 0.3 * bloom;
        ctx.fillStyle = i % 2 ? '#f0a83c' : '#f6c35f';
        ctx.beginPath();
        ctx.ellipse(0, 0, (13 + 24 * bloom) * S, (5 + 7 * bloom) * S, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    ctx.strokeStyle = `rgba(201,133,41,${0.42 + 0.25 * Math.min(kick, 1)})`;
    ctx.lineWidth = 1.4 * S;
    ctx.beginPath();
    ctx.arc(CX, CY, 46 * S * (1 + 0.12 * bloom + 0.12 * kick), 0, TAU);
    ctx.stroke();

    ctx.globalCompositeOperation = 'lighter';

    for (const n of nodes) {
      if (n.alive || n.fade <= 0) continue;
      const r = n.r * S * (1 + (1 - n.fade) * 5);
      ctx.globalAlpha = n.fade * 0.8;
      ctx.drawImage(SPR[0], n.x - r * 2, n.y - r * 2, r * 4, r * 4);
    }
    ctx.globalAlpha = 1;

    ctx.lineCap = 'round';
    const r0 = 58 * S * (1 + 0.12 * bloom + 0.1 * kick);
    for (const ray of RAYS) {
      const a = ray.a + rot;
      const fl = 0.86 + 0.14 * Math.sin(t * ray.sp * 3 + ray.ph);
      const L = (34 + 46 * ray.len) * S * (1 + 0.22 * pulse + 0.85 * bloom + 0.8 * kick) * fl;
      const c = Math.cos(a), s = Math.sin(a);
      const x0 = CX + c * r0, y0 = CY + s * r0, x1 = CX + c * (r0 + L), y1 = CY + s * (r0 + L);
      ctx.strokeStyle = 'rgba(240,168,60,0.16)';
      ctx.lineWidth = 7 * S;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,198,108,0.7)';
      ctx.lineWidth = 1.9 * S;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }

    const orbR = (80 + 14 * pulse + 44 * bloom + 40 * Math.min(kick, 1.4)) * S;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(GLOW, CX - orbR, CY - orbR, orbR * 2, orbR * 2);
    ctx.globalAlpha = 1;
    const cr = 21 * S * (1 + 0.12 * pulse + 0.32 * kick + 0.2 * bloom);
    ctx.drawImage(SPR[2], CX - cr * 1.7, CY - cr * 1.7, cr * 3.4, cr * 3.4);
    ctx.fillStyle = 'rgba(255,226,152,0.85)';
    ctx.beginPath(); ctx.arc(CX, CY, cr * 0.55, 0, TAU); ctx.fill();

    for (const m of motes) {
      const a = Math.min(1, (m.max - m.life) / 0.4) * Math.min(1, m.life / 1.4) * (0.65 + 0.35 * Math.sin(t * 3 + m.seed));
      if (a < 0.01) continue;
      const sz = m.size * 4;
      ctx.globalAlpha = a;
      ctx.drawImage(SPR[m.spr], m.x - sz / 2, m.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    ctx.lineWidth = 1.5 * S;
    for (const rp of ripples) {
      ctx.strokeStyle = `rgba(246,195,95,${(0.5 * rp.life) / rp.max})`;
      ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, TAU); ctx.stroke();
    }

    if (ptr.active) {
      const gr = (60 + 50 * bloom) * S;
      ctx.globalAlpha = ptr.down ? 0.45 : 0.22;
      ctx.drawImage(GLOW, ptr.sx - gr, ptr.sy - gr, gr * 2, gr * 2);
    }
    if (entered && (ptr.active || (ptr.mouse && ptr.inside)) && ptr.x > -1000) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = 'rgba(255,236,194,0.95)';
      ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 2.1 * Math.max(S, 0.8), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'source-over';
    g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function frame(now) {
    if (window.innerWidth !== W || window.innerHeight !== H) resize();
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0.016;
    if (dt > 0.05) dt = 0.05;
    t += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
